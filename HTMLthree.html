<!DOCTYPE html>
<html lang = "en">
<head>
    <link rel = "stylesheet" type = "text/css" href = "styleone.css">
    <title> Coursework </title>
</head>

<body>
    <script src="Javafilethree.js" type="module"></script> 
    

    <div class="page-1">
        <header class="header">
            <h1>Add a Vehicle</h1>
            <nav class = "header-links">
                <ul>
                    <li><a href="HTMLone.html">People Search</a></li>
                    <li><a href="HTMLtwo.html">Vehicle Search</a></li>
                    <li><a href="HTMLthree.html">Add a Vehicle</a></li>
                </ul>
            </nav>
        </header>

        <div class="content-container">
            <aside class="sidebar">
                <img src = "image3.jpg" class = "sidebar1-image" alt="fountain">
            </aside>

            <main class="main-content">
                <h2>Add Vehicle</h2>
                <form id="add-vehicle-form">
                    <input type="text" id="rego" placeholder="Registration" />
                    <input type="text" id="make" placeholder="Make" />
                    <input type="text" id="model" placeholder="Model"/>
                    <input type="text" id="colour" placeholder="Colour" />
                    <input type="text" id="owner" placeholder="Owner Name" />
                    <p id="message-vehicle"></p>
                    <button type="button" id="search-owner-button">Check owner</button>
                </form>

                <div id="container">
                    <div id="owner-results"></div> 
                    <div id="new-owner-form-container"></div>
                </div>

                



            </main>
        </div>

        <footer class="footer">
            <p>Coursework</p>
        </footer>
    </div>


    
</body>
</html>
